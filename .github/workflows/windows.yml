name: Windows application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check release tag
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The release tag must match package.json version v$version."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Check source syntax
        run: npm run check

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts,signing -Filter '*.ps1' -File)
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax check failed: $($file.Name): $($parseErrors[0].Message)" }
          }

      - name: Run tests
        run: npm test

      - name: Check one-time signing initializer without side effects
        shell: pwsh
        run: ./signing/Initialize-GitHubSigning.ps1 -WhatIf

      - name: Upload public one-time signing setup helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QQ_Service-signing-setup
          path: |
            signing/Initialize-GitHubSigning.ps1
            signing/SETUP.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Build portable application
        run: npm run build:exe

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File -Filter 'QQ_Service-*-Windows-x64.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one portable Windows executable.' }
          $file = $files[0]
          $digest = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          "$digest  $($file.Name)" | Set-Content -Encoding utf8NoBOM "$($file.FullName).sha256"

      - name: Upload executable and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QQ_Service-Windows-x64
          path: |
            dist/QQ_Service-*-Windows-x64.exe
            dist/QQ_Service-*-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      # This identity exists only on this runner. PR code never receives the
      # real publisher key, and fixture-signed files are never uploaded.
      - name: Record unsigned third-party executable hashes
        shell: pwsh
        run: node scripts/signing-layout.cjs snapshot dist/win-unpacked "$env:RUNNER_TEMP/qq-vendor-fixture-baseline.json"

      - name: Prepare disposable signing fixture
        id: fixture-setup
        shell: pwsh
        run: |
          ./scripts/test-windows-signing.ps1 -Stage Setup -ProjectRoot $PWD.Path `
            -CertificateDirectory "$env:RUNNER_TEMP/qq-fixture-public" `
            -WorkDirectory "$env:RUNNER_TEMP/qq-fixture-private"

      - name: Build fixture-signed portable application
        env:
          QQ_SERVICE_SIGNING_PUBLIC_DIR: ${{ runner.temp }}/qq-fixture-public
        run: npm run build:exe:signed

      - name: Check fixture signing scope
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          node scripts/signing-layout.cjs verify dist/win-unpacked "$env:RUNNER_TEMP/qq-vendor-fixture-baseline.json" "dist/QQ_Service-$version-Windows-x64.exe"

      - name: Verify fixture signatures, tampering and current-user trust
        shell: pwsh
        run: |
          ./scripts/test-windows-signing.ps1 -Stage Verify -ProjectRoot $PWD.Path `
            -CertificateDirectory "$env:RUNNER_TEMP/qq-fixture-public" `
            -WorkDirectory "$env:RUNNER_TEMP/qq-fixture-private"

      - name: Remove disposable fixture identity
        if: always()
        shell: pwsh
        run: |
          if (Test-Path scripts/test-windows-signing.ps1) {
            ./scripts/test-windows-signing.ps1 -Stage Cleanup -ProjectRoot $PWD.Path `
              -CertificateDirectory "$env:RUNNER_TEMP/qq-fixture-public" `
              -WorkDirectory "$env:RUNNER_TEMP/qq-fixture-private"
          }

  sign-windows:
    name: Sign trusted main Windows build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 25
    # GitHub-side deployment policies additionally allow ONLY the main branch.
    # The same environment must never allow tags or refs/pull/*.
    environment: windows-signing
    steps:
      - name: Check out tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build unsigned comparison baseline
        run: npm run build:exe

      - name: Record third-party executable hashes
        shell: pwsh
        run: node scripts/signing-layout.cjs snapshot dist/win-unpacked "$env:RUNNER_TEMP/qq-vendor-production-baseline.json"

      - name: Import the pinned signing identity
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          ./scripts/windows-signing.ps1 -Action Prepare -ProjectRoot $PWD.Path `
            -WorkDirectory "$env:RUNNER_TEMP/qq-production-signing"

      - name: Build signed portable application
        run: npm run build:exe:signed

      - name: Verify unchanged third-party executables
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          node scripts/signing-layout.cjs verify dist/win-unpacked "$env:RUNNER_TEMP/qq-vendor-production-baseline.json" "dist/QQ_Service-$version-Windows-x64.exe"

      - name: Verify both signatures and write final checksum
        shell: pwsh
        run: |
          ./scripts/windows-signing.ps1 -Action Verify -ProjectRoot $PWD.Path `
            -WorkDirectory "$env:RUNNER_TEMP/qq-production-signing" -SourceSha $env:GITHUB_SHA

      - name: Assemble public signed download bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $executable = "QQ_Service-$version-Windows-x64.exe"
          $destination = New-Item -ItemType Directory -Path dist/signed-bundle
          foreach ($name in @($executable, "$executable.sha256", 'signing-manifest.json')) {
            Copy-Item -LiteralPath "dist/$name" -Destination $destination.FullName
          }
          foreach ($name in @('QQ_Service.cer', 'certificate.json', 'Install-QQServiceTrust.ps1', 'Remove-QQServiceTrust.ps1', 'QQServiceTrust.Common.ps1', 'README.txt')) {
            Copy-Item -LiteralPath "signing/$name" -Destination $destination.FullName
          }

      - name: Upload verified signed executable and public trust files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QQ_Service-Windows-x64-signed
          path: dist/signed-bundle/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Remove imported signing identity and temporary PFX
        if: always()
        shell: pwsh
        run: |
          if (Test-Path scripts/windows-signing.ps1) {
            ./scripts/windows-signing.ps1 -Action Cleanup -ProjectRoot $PWD.Path `
              -WorkDirectory "$env:RUNNER_TEMP/qq-production-signing"
          }

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out tagged source and public publisher pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64

      - name: Download and verify the same-commit signed main build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/download-signed-artifact.mjs

      - name: Create release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "QQ_Service $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $files = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release upload $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Signed release upload failed.' }
