name: Windows application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check release tag
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The release tag must match package.json version v$version."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Check source syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build portable application
        run: npm run build:exe

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File -Filter 'QQ_Service-*-Windows-x64.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one portable Windows executable.' }
          $file = $files[0]
          $digest = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          "$digest  $($file.Name)" | Set-Content -Encoding utf8NoBOM "$($file.FullName).sha256"

      - name: Upload executable and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QQ_Service-Windows-x64
          path: |
            dist/QQ_Service-*-Windows-x64.exe
            dist/QQ_Service-*-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: QQ_Service-Windows-x64
          path: release-assets

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "QQ_Service $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*.exe release-assets/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
