appId: com.qqbridge.dashboard
productName: QQ_Service
executableName: QQ_Service
asar: true
afterPack: scripts/verify-packaged.cjs
directories:
  output: dist
  buildResources: desktop/assets
files:
  - desktop/**
  - package.json
  - '!desktop/**/*.test.*'
  - '!node_modules/**'
extraResources:
  - from: build/backend
    to: backend
  # electron-builder excludes a source directory's root node_modules during
  # generic resource copying, so map those directories explicitly.
  - from: build/backend/node_modules
    to: backend/node_modules
  - from: build/runtime
    to: runtime
  - from: build/runtime/node_modules
    to: runtime/node_modules
  - from: build/windows-runtime-manifest.json
    to: windows-runtime-manifest.json
win:
  icon: desktop/assets/icon.ico
  target:
    - target: portable
      arch:
        - x64
  # Resource metadata and icons are edited with JavaScript; no signing
  # certificate is required for this local development build.
  signExecutable: false
  requestedExecutionLevel: asInvoker
portable:
  artifactName: QQ_Service-${version}-Windows-${arch}.exe
  requestExecutionLevel: user
nsis:
  artifactName: QQ_Service-${version}-Windows-${arch}-Setup.exe
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QQ_Service
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: desktop/assets/icon.ico
  uninstallerIcon: desktop/assets/icon.ico
  installerLanguages:
    - zh_CN
    - en_US
# Portable does not use Wine. The optional NSIS setup target needs this
# official Linux/macOS Wine toolset to prepare its uninstaller when cross-built.
toolsets:
  wine: 1.0.1
publish: null
